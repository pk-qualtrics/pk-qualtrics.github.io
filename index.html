<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QBank</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: "Inter", sans-serif;
      background: #f5f8fc;
      color: #102a43;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    img {
      max-width: 100%;
    }

    header {
      background: #002b5c;
      padding: 20px 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    .logo {
      color: white;
      font-size: 28px;
      font-weight: 800;
    }

    nav {
      display: flex;
      gap: 30px;
      flex-wrap: wrap;
      justify-content: center;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: 500;
      font-size: 15px;
    }

    .hero {
      background:
        linear-gradient(rgba(0, 25, 55, 0.72), rgba(0, 25, 55, 0.72)),
        url("https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?q=80&w=1600&auto=format&fit=crop");

      background-size: cover;
      background-position: center;
      color: white;
      text-align: center;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      flex: 1;
      padding: 120px 60px;
    }

    .hero h1 {
      font-size: 64px;
      line-height: 1.1;
      margin-bottom: 20px;
      max-width: 900px;
    }

    .hero p {
      font-size: 20px;
      line-height: 1.7;
      max-width: 700px;
      margin: 0 auto 40px;
    }

    .hero-buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .btn {
      background: #00a3ff;
      color: white;
      padding: 16px 28px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      transition: 0.3s ease;
      display: inline-block;
    }

    .btn:hover {
      background: #0088d6;
      transform: translateY(-2px);
    }

    footer {
      background: #001b36;
      color: #d0d7e2;
      text-align: center;
      padding: 30px 20px;
      font-size: 14px;
      margin-top: 0;
    }

    /* =========================
       TABLET
    ========================== */

    @media (max-width: 992px) {
      header {
        padding: 20px 30px;
      }

      .hero {
        padding: 100px 30px;
      }

      .hero h1 {
        font-size: 48px;
      }

      .hero p {
        font-size: 18px;
      }
    }

    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 768px) {
      header {
        flex-direction: column;
        text-align: center;
        padding: 20px;
      }

      nav {
        gap: 18px;
      }

      .hero {
        padding: 80px 20px;
      }

      .hero h1 {
        font-size: 36px;
      }

      .hero p {
        font-size: 16px;
        line-height: 1.6;
      }

      .hero-buttons {
        flex-direction: column;
        width: 100%;
        align-items: center;
      }

      .btn {
        width: 100%;
        max-width: 320px;
        text-align: center;
      }
    }

    /* =========================
       SMALL MOBILE
    ========================== */

    @media (max-width: 480px) {
      .logo {
        font-size: 24px;
      }

      nav {
        flex-direction: column;
        gap: 14px;
      }

      .hero {
        padding: 70px 16px;
      }

      .hero h1 {
        font-size: 30px;
      }

      .hero p {
        font-size: 15px;
      }

      .btn {
        padding: 14px 22px;
      }

      footer {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">QBank</div>

    <nav>
      <a href="credit-cards.html">Credit Cards</a>
      <a href="banking.html">Banking</a>
      <a href="rewards.html">Rewards</a>
      <a href="support.html">Support</a>
    </nav>
  </header>

  <section class="hero">

    <h1>Modern Banking Built Around You</h1>

    <p>
      Explore premium credit cards, digital banking solutions,
      exclusive rewards, and dedicated customer support.
    </p>

    <div class="hero-buttons">
      <a href="credit-cards.html" class="btn">Explore Cards</a>
      <a href="banking.html" class="btn">Digital Banking</a>
    </div>

  </section>

  <footer>
    © 2026 QBank Financial Services. All Rights Reserved.
  </footer>

</body>
