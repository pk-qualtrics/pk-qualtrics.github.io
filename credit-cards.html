<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Credit Cards</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  overflow-x:hidden;
}

body{
  font-family:'Inter',sans-serif;
  background:#f5f8fc;
  color:#102a43;
}

/* =========================
   HEADER / NAVBAR
========================= */

header{
  background:#002b5c;
  padding:20px 60px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:relative;
}

.logo{
  color:white;
  text-decoration:none;
  font-size:28px;
  font-weight:800;
}

nav{
  display:flex;
  gap:30px;
}

nav a{
  color:white;
  text-decoration:none;
  font-weight:500;
  font-size:15px;
}

.menu-toggle{
  display:none;
  background:transparent;
  border:none;
  color:white;
  font-size:30px;
  cursor:pointer;
}

/* =========================
   CONTENT
========================= */

.container{
  padding:70px 60px;
}

h1{
  color:#002b5c;
  margin-bottom:40px;
  font-size:42px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:30px;
}

.card{
  background:white;
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
  transition:0.3s ease;
}

.card:hover{
  transform:translateY(-5px);
}

.banner{
  padding:40px;
  color:white;
  background:linear-gradient(135deg,#003566,#0077b6);
}

.banner h2{
  margin-bottom:10px;
}

.banner p{
  opacity:0.95;
}

.content{
  padding:30px;
}

.content p{
  line-height:1.7;
  color:#486581;
  margin-bottom:24px;
}

button{
  width:100%;
  padding:14px;
  border:none;
  background:#00509d;
  color:white;
  border-radius:10px;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
  transition:0.3s ease;
}

button:hover{
  background:#003f7d;
}

/* =========================
   TABLET
========================= */

@media (max-width:992px){

  header{
    padding:20px 30px;
  }

  .container{
    padding:50px 30px;
  }

  h1{
    font-size:36px;
  }
}

/* =========================
   MOBILE NAVBAR
========================= */

@media (max-width:768px){

  header{
    padding:20px;
  }

  .menu-toggle{
    display:block;
  }

  nav{
    display:none;
    flex-direction:column;
    position:absolute;
    top:100%;
    left:0;
    width:100%;
    background:#002b5c;
    padding:10px 0;
    z-index:1000;
  }

  nav.show{
    display:flex;
  }

  nav a{
    padding:16px 20px;
    border-top:1px solid rgba(255,255,255,0.1);
  }

  .container{
    padding:40px 20px;
  }

  h1{
    font-size:32px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .card{
    border-radius:18px;
  }

  .banner{
    padding:30px 24px;
  }

  .content{
    padding:24px;
  }
}

/* =========================
   SMALL MOBILE
========================= */

@media (max-width:480px){

  .logo{
    font-size:24px;
  }

  h1{
    font-size:28px;
  }

  .banner h2{
    font-size:24px;
  }

  .banner p,
  .content p{
    font-size:15px;
  }

  button{
    font-size:15px;
  }
}

</style>
</head>

<body>

<header>

  <a href="index.html" class="logo">QBank</a>

  <button class="menu-toggle" id="menu-toggle">
    ☰
  </button>

  <nav id="navbar">
    <a href="index.html">Home</a>
    <a href="credit-cards.html">Credit Cards</a>
    <a href="banking.html">Banking</a>
    <a href="rewards.html">Rewards</a>
    <a href="support.html">Support</a>
  </nav>

</header>

<div class="container">

  <h1>Credit Cards</h1>

  <div class="grid">

    <div class="card">

      <div class="banner">
        <h2>Travel Elite</h2>
        <p>Premium travel benefits and rewards.</p>
      </div>

      <div class="content">
        <p>
          Earn airline miles, lounge access, and travel insurance coverage.
        </p>

        <button onclick="return false;">
          Apply Now
        </button>
      </div>

    </div>

    <div class="card">

      <div class="banner" style="background:linear-gradient(135deg,#5a189a,#9d4edd)">
        <h2>Cashback Plus</h2>
        <p>Unlimited cashback on daily purchases.</p>
      </div>

      <div class="content">
        <p>
          Get cashback rewards on groceries, fuel, and online shopping.
        </p>

        <button onclick="return false;">
          Apply Now
        </button>
      </div>

    </div>

  </div>

  <div class="Qbank_EmbeddedFeedbackContainer"></div>

</div>

<script>

const menuToggle = document.getElementById("menu-toggle");
const navbar = document.getElementById("navbar");

menuToggle.onclick = function () {
  navbar.classList.toggle("show");
};

</script>

</body>
