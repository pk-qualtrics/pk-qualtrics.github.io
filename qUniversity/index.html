
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apply - QEducation Academy</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f1f5ff;
      color: #172033;
    }

    header {
      background: white;
      padding: 18px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    .logo {
      color: #2563eb;
      font-size: 24px;
      font-weight: bold;
    }

    header a {
      text-decoration: none;
      color: #334155;
    }

    .container {
      max-width: 650px;
      margin: 60px auto;
      padding: 0 20px;
    }

    .form-box {
      background: white;
      padding: 35px;
      border-radius: 15px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }

    h1 {
      text-align: center;
      color: #172554;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px;
      margin-bottom: 20px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
    }

    textarea {
      height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #2563eb;
      text-decoration: none;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #64748b;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">QEducation</div>
  <a href="index.html">← Back to Home</a>
</header>

<div class="container">

  <div class="form-box">

    <h1>Apply to QEducation</h1>

    <p class="subtitle">
      Fill out the application form below to begin your journey.
    </p>

    <form onsubmit="submitForm(event)">

      <label>Full Name</label>
      <input type="text" placeholder="Enter your full name" required>

      <label>Email Address</label>
      <input type="email" placeholder="Enter your email" required>

      <label>Phone Number</label>
      <input type="tel" placeholder="Enter your phone number" required>

      <label>Date of Birth</label>
      <input type="date" required>

      <label>Select Course</label>
      <select required>
        <option value="">Choose a course</option>
        <option>Computer Science</option>
        <option>Business Management</option>
        <option>Digital Design</option>
      </select>

      <label>Previous Education</label>
      <input type="text" placeholder="e.g. High School, Bachelor's">

      <label>Why do you want to join?</label>
      <textarea placeholder="Tell us briefly..."></textarea>

      <button type="submit">Submit Application</button>

    </form>

    <a class="back" href="index.html">Return to Homepage</a>

  </div>

</div>

<footer>
  © 2026 QEducation Academy — Fictional Demo Website
</footer>

<script>
  function submitForm(event) {
    event.preventDefault();

    alert("Thank you! Your demo application has been submitted.");

    // Demo only — no real application is sent.
  }
</script>

</body>
</html>
