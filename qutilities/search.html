    <style>

        .search-page {
            max-width: 1200px;
            margin: 60px auto;

            /* Extra bottom space so results are not hidden
               behind the fixed footer */
            padding: 0 20px 220px;
        }

        .search-title {
            font-size: 42px;
            margin-bottom: 30px;
        }

        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 40px;
        }

        .search-bar input {
            flex: 1;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }

        .search-bar button {
            background: #7c5cff;
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        .search-bar button:hover {
            background: #6848e8;
        }

        .result {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-left: 4px solid #7c5cff;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .08);
        }

        .result h3 {
            margin-bottom: 10px;
        }

        .result h3 a {
            color: #7c5cff;
            text-decoration: none;
        }

        .result h3 a:hover {
            text-decoration: underline;
        }

        .category {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .result p {
            margin-bottom: 0;
        }

        /*
         * Fixed footer
         */
        footer {
    position: relative;
    width: 100%;
    margin-top: 100px;
        }

        /*
         * Optional extra spacer.
         * The main spacing is already handled by
         * .search-page padding-bottom.
         */
        .results-spacer {
            height: 20px;
        }

        /*
         * Mobile layout
         */
        @media (max-width: 600px) {

            .search-page {
                margin: 30px auto;
                padding: 0 15px 250px;
            }

            .search-title {
                font-size: 32px;
            }

            .search-bar {
                flex-direction: column;
            }

            .search-bar button {
                width: 100%;
            }

        }

    </style>

<body>

    <header>

        <div class="logo">
            <a href="index.html">qUtilities</a>

    <section class="search-page">

        <h1 class="search-title" id="searchTitle">
            Search Results
        </h1>


        <div class="search-bar">

            <input
                type="text"
                id="searchBox"
                placeholder="Search qUtilities..."
                autocomplete="off"
            >

            <button id="searchBtn">
                Go
            </button>

        </div>


        <div id="results"></div>


        <!-- Extra space at the end of results -->
        <div class="results-spacer"></div>

    </section>


    <script>

        const searchData = [

            {
                title: "Community Investment Program",
                url: "content/community-investment.html",
                category: "News & Events",
                description:
                    "Learn how qUtilities is supporting local communities."
            },

            {
                title: "Water Conservation Tips",
                url: "content/water-conservation.html",
                category: "Smart Water Use",
                description:
                    "Helpful guidance to reduce household water consumption."
            },

            {
                title: "Emergency Preparedness Guide",
                url: "content/emergency-preparedness.html",
                category: "Safety",
                description:
                    "Resources and planning tips for utility emergencies."
            },

            {
                title: "Pay My Bill",
                url: "pay-my-bill.html",
                category: "Customer Service",
                description:
                    "Manage utility payments securely online."
            },

            {
                title: "Moving Services",
                url: "moving.html",
                category: "Customer Service",
                description:
                    "Start, stop or transfer utility service."
            },

            {
                title: "Water Quality Reports",
                url: "water-quality.html",
                category: "Water Quality",
                description:
                    "Annual testing and compliance reports."
            }

        ];


        function performSearch(term) {

            let html = "";

            const cleanTerm = term.trim().toLowerCase();


            /*
             * If the search box is empty,
             * show all results.
             */
            if (cleanTerm === "") {

                searchData.forEach(function(item) {

                    html += createResult(item);

                });

            } else {

                searchData.forEach(function(item) {

                    if (

                        item.title
                            .toLowerCase()
                            .includes(cleanTerm)

                        ||

                        item.description
                            .toLowerCase()
                            .includes(cleanTerm)

                        ||

                        item.category
                            .toLowerCase()
                            .includes(cleanTerm)

                    ) {

                        html += createResult(item);

                    }

                });

            }


            /*
             * No results
             */
            if (html === "") {

                html = `
                    <div class="result">

                        <h3>No results found</h3>

                        <p>
                            Please try another search term.
                        </p>

                    </div>
                `;

            }


            $("#results").html(html);


            /*
             * Update page title
             */
            if (cleanTerm === "") {

                $("#searchTitle").text("Search Results");

            } else {

                $("#searchTitle").text(
                    'Search Results for "' + term.trim() + '"'
                );

            }

        }


        /*
         * Create individual search result
         */
        function createResult(item) {

            return `

                <div class="result">

                    <h3>

                        <a href="${item.url}">
                            ${item.title}
                        </a>

                    </h3>

                    <div class="category">
                        ${item.category}
                    </div>

                    <p>
                        ${item.description}
                    </p>

                </div>

            `;

        }


        /*
         * Get search term from URL
         */
        const params =
            new URLSearchParams(window.location.search);

        const searchTerm =
            params.get("q") || "";


        /*
         * Put URL search term into input
         */
        $("#searchBox").val(searchTerm);


        /*
         * Run search when page loads
         */
        performSearch(searchTerm);


        /*
         * Search button
         */
        $("#searchBtn").click(function() {

            const term =
                $("#searchBox").val().trim();


            /*
             * Update URL
             */
            const newUrl =
                term === ""
                    ? window.location.pathname
                    : window.location.pathname +
                      "?q=" +
                      encodeURIComponent(term);


            window.history.pushState(
                {},
                "",
                newUrl
            );


            /*
             * Perform search
             */
            performSearch(term);

        });


        /*
         * Search when pressing Enter
         */
        $("#searchBox").keypress(function(e) {

            if (e.which === 13) {

                $("#searchBtn").click();

            }

        });

    </script>
