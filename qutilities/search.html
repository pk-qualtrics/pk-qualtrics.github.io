<body>

    <header>

        <div class="logo">
             <a href="/index.html">qUtilities</a>
        </div>

        <nav>
            <a href="/community/avondale.html"Community</a>
            <a href="search.html">Search</a>
            <a href="#">Contact Us</a>
            <a href="#">Alerts</a>

        </nav>

    </header>

    <section class="search-page">

        <h1 class="search-title" id="searchTitle">
            Search Results
        </h1>

        <div class="search-bar">

            <input
                type="text"
                id="searchBox"
                placeholder="Search qUtilities..."
            >

            <button id="searchBtn">
                Go
            </button>

        </div>

        <div id="results"></div>

    </section>

<script>

const searchData = [

{
    title: "Community Investment Program",
    url: "content/community-investment.html",
    category: "News & Events",
    description: "Learn how qUtilities is supporting local communities."
},

{
    title: "Water Conservation Tips",
    url: "content/water-conservation.html",
    category: "Smart Water Use",
    description: "Helpful guidance to reduce household water consumption."
},

{
    title: "Emergency Preparedness Guide",
    url: "content/emergency-preparedness.html",
    category: "Safety",
    description: "Resources and planning tips for utility emergencies."
},

{
    title: "Pay My Bill",
    url: "pay-my-bill.html",
    category: "Customer Service",
    description: "Manage utility payments securely online."
},

{
    title: "Moving Services",
    url: "moving.html",
    category: "Customer Service",
    description: "Start, stop or transfer utility service."
},

{
    title: "Water Quality Reports",
    url: "water-quality.html",
    category: "Water Quality",
    description: "Annual testing and compliance reports."
}

];

function performSearch(term){

    let html = "";

    searchData.forEach(function(item){

        if(
            item.title.toLowerCase().includes(term) ||
            item.description.toLowerCase().includes(term) ||
            item.category.toLowerCase().includes(term)
        ){

            html += `
                <div class="result">

                    <h3>
                        <a href="${item.url}">
                            ${item.title}
                        </a>
                    </h3>

                    <div class="category">
                        ${item.category}
                    </div>

                    <p>
                        ${item.description}
                    </p>

                </div>
            `;
        }

    });

    if(html === ""){

        html = `
            <div class="result">
                <h3>No results found</h3>
                <p>Please try another search term.</p>
            </div>
        `;
    }

    $("#results").html(html);

    $("#searchTitle").text(
        'Search Results for "' + term + '"'
    );
}

const params =
    new URLSearchParams(window.location.search);

const searchTerm =
    params.get("q") || "";

$("#searchBox").val(searchTerm);

if(searchTerm !== ""){
    performSearch(searchTerm.toLowerCase());
}

$("#searchBtn").click(function(){

    const term =
        $("#searchBox").val().toLowerCase();

    performSearch(term);

});

$("#searchBox").keypress(function(e){

    if(e.which === 13){

        $("#searchBtn").click();

    }

});

</script>
