            background: #0078d4;
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;

            transition: background .3s;

        }

            margin-top: 20px;

            color: #0078d4;

            background: #1f2937;
            color: #fff;
            text-align: center;

            margin-top: auto;
        }

        footer a {
            color: #fff;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
